name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy backend
    runs-on: ubuntu-latest
    concurrency: fly-backend-deploy

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config fly.toml --app polaroid-glossy-backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
